<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Agendar Aula Experimental</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/main.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>

<style>
body {
  margin:0;
  font-family: Arial, sans-serif;
  background:#f4f6f8;
}

header {
  background:#0d6efd;
  color:white;
  padding:15px 30px;
  font-size:20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.back-btn {
  background: rgba(255,255,255,0.2);
  color: white;
  border: none;
  padding: 8px 16px;
  border-radius: 6px;
  cursor: pointer;
  text-decoration: none;
  font-size: 14px;
}

.back-btn:hover {
  background: rgba(255,255,255,0.3);
}

.container {
  max-width:900px;
  margin:auto;
  padding:25px;
}

.card {
  background:white;
  padding:25px;
  border-radius:10px;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.info {
  background: #e7f3ff;
  padding: 15px;
  border-radius: 8px;
  margin-bottom: 20px;
  color: #004085;
  border-left: 4px solid #0d6efd;
}

button {
  width:100%;
  padding:14px;
  background:#0d6efd;
  color:white;
  border:none;
  border-radius:8px;
  font-size:16px;
  cursor:pointer;
  font-weight: 500;
  margin-top:15px;
  transition: 0.3s;
}

button:hover:not(:disabled) {
  background:#0b5ed7;
}

button:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

#calendar {
  margin: 20px 0;
}

.selected-info {
  background: #d4edda;
  padding: 12px;
  border-radius: 6px;
  margin-top: 15px;
  color: #155724;
  display: none;
}

@media (max-width: 600px) {
  header {
    flex-direction: column;
    gap: 10px;
  }

  .container {
    padding: 15px;
  }
}
</style>
</head>

<body>

<header>
  <span>Agendar Aula Experimental</span>
  <a href="dashboard-student.html" class="back-btn">← Voltar</a>
</header>

<div class="container">
  <div class="card">
    <div class="info">
      <strong>💡 Como funciona:</strong><br>
      1. Selecione um horário disponível no calendário<br>
      2. Clique em "Continuar para Pagamento"<br>
      3. Pague apenas $5 USD pela aula experimental
    </div>

    <p><strong>Seleciona um horário disponível:</strong></p>
    <div id="calendar"></div>

    <div id="selectedInfo" class="selected-info">
      ✓ Horário selecionado: <span id="selectedTime"></span>
    </div>

    <button id="confirm">Continuar para Pagamento ($5)</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

/* 🔥 FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyBpCB1ePW49VgUvON9LSNEBsTQcKXoAg40",
  authDomain: "portuguese-teacher-platf-68bc5.firebaseapp.com",
  projectId: "portuguese-teacher-platf-68bc5"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

/* 🔐 VARIÁVEIS */
let currentUser = null;
let selectedSlot = null;

/* 🔐 AUTENTICAÇÃO */
onAuthStateChanged(auth, (user) => {
  if (!user) {
    window.location.href = "login.html";
    return;
  }
  currentUser = user;
});

/* 🗓️ CALENDÁRIO */
const calendar = new FullCalendar.Calendar(
  document.getElementById("calendar"),
  {
    initialView: "timeGridWeek",
    height: 450,
    selectable: true,
    allDaySlot: false,
    slotMinTime: "08:00:00",
    slotMaxTime: "20:00:00",
    locale: 'pt',
    buttonText: {
      today: 'Hoje',
      month: 'Mês',
      week: 'Semana',
      day: 'Dia'
    },
    headerToolbar: {
      left: 'prev,next today',
      center: 'title',
      right: 'timeGridWeek,timeGridDay'
    },

    select(info) {
      selectedSlot = info;
      
      // Formata a data e hora
      const startDate = new Date(info.start);
      const endDate = new Date(info.end);
      
      const dateStr = startDate.toLocaleDateString('pt-PT', {
        day: '2-digit',
        month: 'long',
        year: 'numeric'
      });
      
      const timeStr = `${startDate.toLocaleTimeString('pt-PT', {
        hour: '2-digit',
        minute: '2-digit'
      })} - ${endDate.toLocaleTimeString('pt-PT', {
        hour: '2-digit',
        minute: '2-digit'
      })}`;
      
      // Mostra informação
      document.getElementById("selectedTime").textContent = `${dateStr} às ${timeStr}`;
      document.getElementById("selectedInfo").style.display = "block";
    }
  }
);

calendar.render();

/* ✅ CONFIRMAR */
document.getElementById("confirm").onclick = async () => {

  if (!selectedSlot) {
    alert("Seleciona primeiro um horário no calendário.");
    return;
  }

  const confirmBtn = document.getElementById("confirm");
  confirmBtn.disabled = true;
  confirmBtn.textContent = "A redirecionar...";

  try {
    // Extrai dados do slot selecionado
    const date = selectedSlot.startStr.split("T")[0];
    const start = selectedSlot.startStr.split("T")[1].slice(0, 5);
    const end = selectedSlot.endStr.split("T")[1].slice(0, 5);

    // Redireciona para página de pagamento com os dados
    window.location.href = `payment.html?date=${date}&start=${start}&end=${end}`;

  } catch (err) {
    console.error(err);
    alert("Erro ao processar. Tenta novamente.");
    confirmBtn.disabled = false;
    confirmBtn.textContent = "Continuar para Pagamento ($5)";
  }
};
</script>

</body>
</html>

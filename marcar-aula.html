<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Marcar Aula</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: Arial, sans-serif;
  background:#f4f6f8;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.box {
  background:white;
  padding:30px;
  width:350px;
  border-radius:10px;
}
input, button {
  width:100%;
  padding:12px;
  margin-top:10px;
}
button {
  background:#0d6efd;
  color:white;
  border:none;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="box">
  <h3>Marcar Aula</h3>

  <input type="date" id="date">
  <input type="time" id="start">
  <input type="time" id="end">

  <button id="save">Confirmar Aula</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { 
  getFirestore, 
  collection, 
  addDoc, 
  serverTimestamp,
  doc,
  getDoc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBpCB1ePW49VgUvON9LSNEBsTQcKXoAg40",
  authDomain: "portuguese-teacher-platf-68bc5.firebaseapp.com",
  projectId: "portuguese-teacher-platf-68bc5"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let user;

onAuthStateChanged(auth, async (u)=>{
  if(!u){
    location.href="login.html";
    return;
  }
  user = u;
});

save.onclick = async ()=>{
  if(!date.value || !start.value || !end.value){
    alert("Preencha todos os campos");
    return;
  }

  // 🔎 BUSCA PROFESSOR (fixo por enquanto)
  const teacherId = "UID_DO_PROFESSOR"; // ← substitui pelo teu UID

  await addDoc(collection(db,"classes"),{
    studentId: user.uid,
    studentEmail: user.email,
    teacherId: teacherId,
    date: date.value,
    start: start.value,
    end: end.value,
    createdAt: serverTimestamp()
  });

  alert("Aula marcada com sucesso!");
  location.href="dashboard-student.html";
};
</script>

</body>
</html>

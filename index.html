<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Professor de Português Online | Aulas Personalizadas</title>
  <meta name="description" content="Aulas de português online com professor experiente. Conversação, exames oficiais, negócios e viagens. Aula experimental disponível.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    :root {
      --primary:#0d6efd;
      --secondary:#6610f2;
      --success:#28a745;
      --dark:#222;
      --light:#f4f7fb;
    }

    * { box-sizing:border-box; }

    body {
      margin:0;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background:var(--light);
      color:#333;
      line-height:1.6;
    }

    h1, h2, h3 {
      margin-top:0;
      color:#111;
    }

    a { text-decoration:none; }

    /* HEADER */
    header {
      background:linear-gradient(90deg, var(--primary), var(--secondary));
      color:#fff;
      padding:70px 20px;
      text-align:center;
    }

    header h1 {
      font-size:2.8em;
      margin-bottom:10px;
    }

    header p {
      font-size:1.2em;
      max-width:700px;
      margin:0 auto 30px;
      opacity:0.95;
    }

    .cta {
      display:inline-block;
      padding:14px 30px;
      background:#fff;
      color:var(--primary);
      border-radius:30px;
      font-weight:bold;
      transition:0.3s;
    }

    .cta:hover {
      background:#eaeaea;
      transform:translateY(-2px);
    }

    /* PROFESSOR */
    .teacher {
      background:#fff;
      max-width:900px;
      margin:-60px auto 60px;
      padding:40px 25px;
      border-radius:20px;
      text-align:center;
      box-shadow:0 12px 30px rgba(0,0,0,0.12);
    }

    .teacher img {
      width:170px;
      height:170px;
      border-radius:50%;
      object-fit:cover;
      border:5px solid var(--primary);
      margin-bottom:15px;
    }

    .teacher h2 {
      color:var(--primary);
      font-size:2.1em;
    }

    .teacher .role {
      font-size:1.1em;
      color:#666;
      margin-bottom:20px;
    }

    .prices {
      margin:25px 0;
    }

    .old-price {
      color:#c0392b;
      text-decoration:line-through;
      font-size:1.1em;
    }

    .new-price {
      color:var(--success);
      font-size:1.8em;
      font-weight:bold;
    }

    .actions a {
      margin:10px;
    }

    .btn {
      display:inline-block;
      padding:12px 26px;
      border-radius:8px;
      background:var(--primary);
      color:#fff;
      font-weight:bold;
      transition:0.3s;
    }

    .btn.secondary {
      background:#555;
    }

    .btn:hover {
      background:var(--secondary);
      transform:translateY(-2px);
    }

    /* SEÇÕES */
    section {
      padding:50px 20px;
      max-width:1100px;
      margin:auto;
    }

    .section-title {
      text-align:center;
      margin-bottom:40px;
    }

    /* CARDS */
    .cards {
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(260px,1fr));
      gap:25px;
    }

    .card {
      background:#fff;
      padding:25px;
      border-radius:16px;
      box-shadow:0 8px 22px rgba(0,0,0,0.1);
      transition:0.3s;
    }

    .card:hover {
      transform:translateY(-6px);
      box-shadow:0 14px 30px rgba(0,0,0,0.15);
    }

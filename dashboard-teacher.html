<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Dashboard Professor</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/main.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/main.min.js"></script>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f6f8;
  margin: 0;
}

header {
  background: #198754;
  color: white;
  padding: 15px 30px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

header button {
  background: red;
  border: none;
  color: white;
  padding: 6px 15px;
  border-radius: 5px;
  cursor: pointer;
}

.container {
  max-width: 1200px;
  margin: auto;
  padding: 20px;
}

.cards {
  display: flex;
  gap: 20px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}

.card {
  background: white;
  flex: 1;
  padding: 20px;
  border-radius: 10px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.1);
  text-align: center;
}

#calendar {
  background: white;
  padding: 15px;
  border-radius: 10px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}
</style>
</head>

<body>

<header>
  <h2 id="welcome">Dashboard do Professor</h2>
  <button id="logout">Sair</button>
</header>

<div class="container">

  <div class="cards">
    <div class="card">
      <h3>Total de Alunos</h3>
      <p id="totalStudents">0</p>
    </div>

    <div class="card">
      <h3>Total de Aulas</h3>
      <p id="totalClasses">0</p>
    </div>
  </div>

  <div id="calendar"></div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, collection, getDocs, query, where, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBpCB1ePW49VgUvON9LSNEBsTQcKXoAg40",
  authDomain: "portuguese-teacher-platf-68bc5.firebaseapp.com",
  projectId: "portuguese-teacher-platf-68bc5"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let calendar;

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    window.location.href = "login.html";
    return;
  }

  const userDoc = await getDoc(doc(db, "users", user.uid));
  if (!userDoc.exists() || userDoc.data().role !== "teacher") {
    window.location.href = "login.html";
    return;
  }

  document.getElementById("welcome").innerText =
    `Bem-vindo, ${userDoc.data().name || user.email}`;

  loadStats(user.uid);
  loadCalendar(user.uid);
});

document.getElementById("logout").onclick = () =>
  signOut(auth).then(() => window.location.href = "login.html");

async function loadStats(teacherId) {
  const studentsSnap = await getDocs(
    query(collection(db, "users"), where("role", "==", "student"))
  );

  document.getElementById("totalStudents").innerText = studentsSnap.size;

  const classesSnap = await getDocs(
    query(collection(db, "classes"), where("teacherId", "==", teacherId))
  );

  document.getElementById("totalClasses").innerText = classesSnap.size;
}

async function loadCalendar(teacherId) {
  const calendarEl = document.getElementById("calendar");

  calendar = new FullCalendar.Calendar(calendarEl, {
    initialView: "dayGridMonth",
    height: 550,
    events: []
  });

  calendar.render();

  const classesSnap = await getDocs(
    query(collection(db, "classes"), where("teacherId", "==", teacherId))
  );

  const events = [];
  classesSnap.forEach(docSnap => {
    const c = docSnap.data();
    events.push({
      title: `Aula com ${c.studentEmail}`,
      start: `${c.date}T${c.start}`,
      end: `${c.date}T${c.end}`
    });
  });

  calendar.addEventSource(events);
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Dashboard do Professor</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/main.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f6f8;
}

header {
  background: #198754;
  color: white;
  padding: 15px 30px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

header button {
  background: #dc3545;
  border: none;
  color: white;
  padding: 6px 15px;
  border-radius: 5px;
  cursor: pointer;
}

.container {
  max-width: 1200px;
  margin: auto;
  padding: 20px;
}

.cards {
  display: flex;
  gap: 20px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}

.card {
  background: white;
  flex: 1;
  padding: 20px;
  border-radius: 10px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.1);
  text-align: center;
}

#calendar {
  background: white;
  padding: 15px;
  border-radius: 10px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}
</style>
</head>

<body>

<header>
  <h2 id="welcome">Dashboard do Professor</h2>
  <button id="logout">Sair</button>
</header>

<div class="container">

  <div class="cards">
    <div class="card">
      <h3>Total de Aulas</h3>
      <p id="totalClasses">0</p>
    </div>

    <div class="card">
      <h3>Aulas Pendentes</h3>
      <p id="pendingClasses">0</p>
    </div>
  </div>

  <div id="calendar"></div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, collection, getDocs, query, where, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

/* 🔥 FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyBpCB1ePW49VgUvON9LSNEBsTQcKXoAg40",
  authDomain: "portuguese-teacher-platf-68bc5.firebaseapp.com",
  projectId: "portuguese-teacher-platf-68bc5"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let calendar;

/* 🔐 AUTENTICAÇÃO + VERIFICA SE É PROFESSOR */
onAuthStateChanged(auth, async (user) => {
  if (!user) {
    window.location.href = "login.html";
    return;
  }

  const userDoc = await getDoc(doc(db, "users", user.uid));

  if (!userDoc.exists() || userDoc.data().role !== "teacher") {
    alert("Acesso negado.");
    window.location.href = "login.html";
    return;
  }

  document.getElementById("welcome").innerText =
    `Bem-vindo, ${userDoc.data().name}`;

  loadAppointments(user.uid);
});

/* 🚪 LOGOUT */
document.getElementById("logout").onclick = () =>
  signOut(auth).then(() => window.location.href = "login.html");

/* 📅 CARREGAR AULAS DO PROFESSOR */
async function loadAppointments(teacherId) {

  const snap = await getDocs(
    query(
      collection(db, "appointments"),
      where("teacherId", "==", teacherId)
    )
  );

  const events = [];
  let pending = 0;

  snap.forEach(docSnap => {
    const a = docSnap.data();

    if (a.status === "pending") pending++;

    events.push({
      title: a.type === "experimental"
        ? "Aula Experimental"
        : "Aula Normal",
      start: `${a.date}T${a.start}`,
      end: `${a.date}T${a.end}`
    });
  });

  document.getElementById("totalClasses").innerText = snap.size;
  document.getElementById("pendingClasses").innerText = pending;

  renderCalendar(events);
}

/* 🗓️ CALENDÁRIO */
function renderCalendar(events) {
  const calendarEl = document.getElementById("calendar");

  calendar = new FullCalendar.Calendar(calendarEl, {
    initialView: "dayGridMonth",
    height: 550,
    events: events
  });

  calendar.render();
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Cadastro do Aluno</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f6f8;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

.container {
  background: #fff;
  padding: 35px;
  border-radius: 12px;
  width: 100%;
  max-width: 480px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.1);
}

h2 {
  text-align: center;
  color: #0d6efd;
}

.step {
  display: none;
}

.step.active {
  display: block;
}

input, select {
  width: 100%;
  padding: 12px;
  margin: 12px 0;
  border-radius: 8px;
  border: 1px solid #ccc;
}

button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border: none;
  border-radius: 8px;
  background: #0d6efd;
  color: #fff;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #084298;
}

.objectives button {
  background: #e7f0ff;
  color: #0d3c91;
  margin: 8px 0;
}

.objectives button:hover {
  background: #d0e0ff;
}
</style>
</head>

<body>

<div class="container">
<h2>Cadastro do Aluno</h2>

<!-- STEP 1 -->
<div class="step active">
  <input id="name" placeholder="Nome completo">
  <input id="birthplace" placeholder="Local de nascimento">
  <button onclick="next()">Próximo</button>
</div>

<!-- STEP 2 -->
<div class="step">
  <input id="languages" placeholder="Idiomas que fala (ex: Inglês, Espanhol)">
  <button onclick="next()">Próximo</button>
</div>

<!-- STEP 3 -->
<div class="step">
  <p><strong>Objetivo principal</strong></p>
  <div class="objectives">
    <button onclick="setObjective('Trabalho / Negócios')">Trabalho / Negócios</button>
    <button onclick="setObjective('Viagens / Hobbies')">Viagens / Hobbies</button>
    <button onclick="setObjective('Preparação para Exames')">Preparação para Exames</button>
  </div>
</div>

<!-- STEP 4 -->
<div class="step">
  <select id="level">
    <option value="">Nível de Português</option>
    <option>Iniciante</option>
    <option>Intermediário</option>
    <option>Avançado</option>
  </select>
  <button onclick="next()">Próximo</button>
</div>

<!-- STEP 5 -->
<div class="step">
  <p><strong>Dias preferidos</strong></p>
  <label><input type="checkbox" value="Segunda"> Segunda</label><br>
  <label><input type="checkbox" value="Terça"> Terça</label><br>
  <label><input type="checkbox" value="Quarta"> Quarta</label><br>
  <label><input type="checkbox" value="Quinta"> Quinta</label><br>
  <label><input type="checkbox" value="Sexta"> Sexta</label><br><br>
  <button onclick="finish()">Finalizar</button>
</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBpCB1ePW49VgUvON9LSNEBsTQcKXoAg40",
  authDomain: "portuguese-teacher-platf-68bc5.firebaseapp.com",
  projectId: "portuguese-teacher-platf-68bc5",
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let step = 0;
let objective = "";

const steps = document.querySelectorAll(".step");

function next() {
  steps[step].classList.remove("active");
  step++;
  steps[step].classList.add("active");
}

window.setObjective = (val) => {
  objective = val;
  next();
};

window.finish = async () => {
  const days = [...document.querySelectorAll("input[type=checkbox]:checked")].map(c => c.value);

  const user = auth.currentUser;
  if (!user) return alert("Utilizador não autenticado");

  await setDoc(doc(db, "users", user.uid), {
    role: "student",
    name: name.value,
    birthplace: birthplace.value,
    languages: languages.value,
    objective,
    level: level.value,
    preferredDays: days,
    createdAt: new Date()
  });

  window.location.href = "dashboard-student-modern.html";
};
</script>

</body>
</html>

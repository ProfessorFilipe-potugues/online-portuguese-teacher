<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Dashboard | Português Online</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      display: flex;
      height: 100vh;
    }

    /* SIDEBAR */
    .sidebar {
      width: 240px;
      background: #0d6efd;
      color: white;
      padding: 20px;
    }

    .sidebar h2 {
      margin-top: 0;
      font-size: 20px;
    }

    .sidebar a {
      display: block;
      color: white;
      padding: 10px 0;
      text-decoration: none;
      opacity: 0.9;
    }

    .sidebar a:hover {
      opacity: 1;
    }

    /* MAIN */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    /* TOPBAR */
    .topbar {
      background: white;
      padding: 15px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .topbar button {
      background: red;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 5px;
      cursor: pointer;
    }

    /* CONTENT */
    .content {
      padding: 30px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    .card h3 {
      margin-top: 0;
      color: #0d6efd;
    }
  </style>
</head>
<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <h2>Português Online</h2>
  <a href="#">Dashboard</a>
  <a href="#">Minhas Aulas</a>
  <a href="#">Pagamentos</a>
  <a href="#">Definições</a>
</div>

<!-- MAIN -->
<div class="main">

  <div class="topbar">
    <div id="welcome">Bem-vindo</div>
    <button id="logout">Sair</button>
  </div>

  <div class="content">
    <div class="cards">
      <div class="card">
        <h3>Saldo</h3>
        <p><strong>$<span id="balance">0</span></strong></p>
      </div>

      <div class="card">
        <h3>Próxima Aula</h3>
        <p>A definir</p>
      </div>

      <div class="card">
        <h3>Objetivo</h3>
        <p>Conversação</p>
      </div>

      <div class="card">
        <h3>Status</h3>
        <p>Aluno ativo</p>
      </div>
    </div>
  </div>

</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBpCB1ePW49VgUvON9LSNEBsTQcKXoAg40",
    authDomain: "portuguese-teacher-platf-68bc5.firebaseapp.com",
    projectId: "portuguese-teacher-platf-68bc5",
    storageBucket: "portuguese-teacher-platf-68bc5.appspot.com",
    messagingSenderId: "653549982098",
    appId: "1:653549982098:web:42bba4cc75ca56bc69314b"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      window.location.href = "login.html";
      return;
    }

    const userDoc = await getDoc(doc(db, "users", user.uid));
    const data = userDoc.data();

    document.getElementById("welcome").innerText =
      `Bem-vindo, ${data?.name || user.email}`;

    document.getElementById("balance").innerText =
      data?.balance || 0;
  });

  document.getElementById("logout").onclick = () => {
    signOut(auth).then(() => window.location.href = "login.html");
  };
</script>

</body>
</html>

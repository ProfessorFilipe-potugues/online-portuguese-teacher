<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Dashboard Aluno - Português Online</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/main.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/main.min.js"></script>

<style>
  body { font-family: Arial,sans-serif; margin:0; background:#f4f6f8; }
  header { background:#0d6efd; color:white; padding:15px 30px; display:flex; justify-content:space-between; align-items:center; }
  header h1 { margin:0; font-size:20px; }
  header button { padding:6px 15px; border:none; border-radius:5px; cursor:pointer; background:red; color:white; }
  .container { padding:20px; display:flex; flex-direction:column; gap:20px; max-width:900px; margin:auto; }
  .card { background:white; padding:20px; border-radius:10px; box-shadow:0 5px 15px rgba(0,0,0,0.1); }
  .card h2 { margin:0 0 10px 0; }
  #calendar { background:white; padding:10px; border-radius:10px; box-shadow:0 5px 15px rgba(0,0,0,0.1); }
  button.book { padding:12px 20px; border:none; border-radius:5px; background:#0d6efd; color:white; font-size:16px; cursor:pointer; }
</style>
</head>
<body>

<header>
  <h1 id="welcome-header">Bem-vindo</h1>
  <button id="logout">Sair</button>
</header>

<div class="container">

  <div class="card">
    <h2>Saldo: $<span id="balance">0</span></h2>
  </div>

  <div class="card">
    <h2>Próxima Aula: <span id="nextClass">A definir</span></h2>
  </div>

  <div class="card">
    <button class="book" id="bookClassBtn">Marcar Aula</button>
  </div>

  <div id="calendar"></div>

</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
  import { getFirestore, collection, addDoc, getDocs, query, where, orderBy, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBpCB1ePW49VgUvON9LSNEBsTQcKXoAg40",
    authDomain: "portuguese-teacher-platf-68bc5.firebaseapp.com",
    projectId: "portuguese-teacher-platf-68bc5",
    storageBucket: "portuguese-teacher-platf-68bc5.appspot.com",
    messagingSenderId: "653549982098",
    appId: "1:653549982098:web:42bba4cc75ca56bc69314b"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let currentUser = null;

  // Autenticação
  onAuthStateChanged(auth, async (user) => {
    if(!user) { window.location.href="login.html"; return; }
    currentUser = user;

    const userDoc = await (await db).getDoc(doc(db,"users",user.uid));
    const data = userDoc.data();
    document.getElementById("welcome-header").innerText = `Bem-vindo, ${data.name}`;
    document.getElementById("balance").innerText = data.balance || 0;

    loadClasses();
  });

  document.getElementById("logout").onclick = () => signOut(auth).then(()=>window.location.href="login.html");

  // FullCalendar
  let calendarEl = document.getElementById('calendar');
  let calendar = new FullCalendar.Calendar(calendarEl, {
    initialView: 'dayGridMonth',
    height: 600,
    events: []
  });
  calendar.render();

  async function loadClasses(){
    const classesRef = collection(db,"classes");
    const q = query(classesRef, where("studentId","==",currentUser.uid), orderBy("date"));
    const snapshot = await getDocs(q);
    const events = [];
    let nextClassText = "A definir";

    snapshot.forEach(doc => {
      const c = doc.data();
      events.push({
        title: `Aula com ${c.teacherEmail}`,
        start: c.date + "T" + c.start,
        end: c.date + "T" + c.end
      });
    });

    events.sort((a,b)=>new Date(a.start)-new Date(b.start));
    if(events.length>0) nextClassText = events[0].start;
    document.getElementById("nextClass").innerText = nextClassText;
    calendar.addEventSource(events);
  }

  // Marcar aula (simplificado para teste)
  document.getElementById("bookClassBtn").onclick = async ()=>{
    const date = prompt("Data da aula (YYYY-MM-DD):");
    const start = prompt("Hora início (HH:MM):","08:00");
    const end = prompt("Hora fim (HH:MM):","09:00");
    const repeat = confirm("Deseja repetir semanalmente?");
    const weeks = repeat?parseInt(prompt("Quantas semanas?","4")):1;

    for(let i=0;i<weeks;i++){
      const dt = new Date(date);
      dt.setDate(dt.getDate()+i*7);
      await addDoc(collection(db,"classes"),{
        studentId: currentUser.uid,
        studentEmail: currentUser.email,
        teacherId: "teacherUIDhere",
        teacherEmail: "professor@gmail.com",
        date: dt.toISOString().split('T')[0],
        start: start,
        end: end,
        status: "confirmed",
        createdAt: new Date()
      });
    }

    loadClasses();
    alert("Aula marcada com sucesso!");
  };
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Dashboard - Professor de Português Online</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: Arial, sans-serif; padding: 30px; background: #f4f6f8; color: #333; }
    h1 { color: #0d6efd; text-align: center; }
    .balance { font-size: 24px; margin: 20px 0; text-align: center; }
    .logout { display: block; margin: 20px auto; padding: 12px 25px; background: red; color: white; text-align: center; text-decoration: none; border-radius: 5px; width: 150px; }
    .logout:hover { background: darkred; }
  </style>
</head>
<body>

<h1>Dashboard</h1>
<div class="balance">Saldo disponível: $0</div>
<a class="logout" href="login.html">Sair</a>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBpCB1ePW49VgUvON9LSNEBsTQcKXoAg40",
  authDomain: "portuguese-teacher-platf-68bc5.firebaseapp.com",
  projectId: "portuguese-teacher-platf-68bc5",
  storageBucket: "portuguese-teacher-platf-68bc5.firebasestorage.app",
  messagingSenderId: "653549982098",
  appId: "1:653549982098:web:42bba4cc75ca56bc69314b"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

onAuthStateChanged(auth, async user => {
  if (!user) {
    window.location.href = "login.html";
  } else {
    const userDoc = await getDoc(doc(db, "users", user.uid));
    const balance = userDoc.data()?.balance || 0;
    document.querySelector(".balance").innerText = "Saldo disponível: $" + balance;
  }
});

document.querySelector(".logout").addEventListener("click", () => {
  signOut(auth).then(() => window.location.href = "login.html");
});
</script>

</body>
</html>

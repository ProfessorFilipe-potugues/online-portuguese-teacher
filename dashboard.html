<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Dashboard | Professor de Português Online</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 0;
    }

    header {
      background: #0d6efd;
      color: white;
      padding: 20px;
      text-align: center;
    }

    section {
      padding: 20px;
      max-width: 900px;
      margin: auto;
    }

    .card {
      background: #fff;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    button {
      padding: 12px 20px;
      background: #0d6efd;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background: #084298;
    }
  </style>
</head>
<body>

<header>
  <h1>Dashboard do Aluno</h1>
  <p>Bem-vindo ao Professor de Português Online</p>
  <button onclick="logout()">Sair</button>
</header>

<section>
  <div class="card">
    <h2>Saldo do Aluno</h2>
    <p>USD <span id="balance">0.00</span></p>
  </div>

  <div class="card">
    <h2>Agendar Aula</h2>
    <input type="date" id="classDate">
    <input type="time" id="classTime">
    <button onclick="scheduleClass()">Agendar Aula</button>
  </div>

  <div class="card">
    <h2>Pagar Aula</h2>
    <p>Escolha forma de pagamento:</p>
    <button onclick="pay('paypal')">Pagar com PayPal</button>
    <button onclick="pay('card')">Pagar com Cartão</button>
  </div>
</section>

<!-- 🔥 FIREBASE -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBpCB1ePW49VgUvON9LSNEBsTQcKXoAg40",
    authDomain: "portuguese-teacher-platform.firebaseapp.com",
    projectId: "portuguese-teacher-platform",
    storageBucket: "portuguese-teacher-platform.appspot.com",
    messagingSenderId: "653549982098",
    appId: "1:653549982098:web:42bba4cc75ca56bc69314b"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const balanceEl = document.getElementById("balance");

  // Verifica se o aluno está logado
  onAuthStateChanged(auth, async user => {
    if (user) {
      const userDoc = doc(db, "students", user.uid);
      const docSnap = await getDoc(userDoc);

      if (!docSnap.exists()) {
        await setDoc(userDoc, { balance: 0, classes: [] });
      }

      const data = (await getDoc(userDoc)).data();
      balanceEl.innerText = data.balance.toFixed(2);
    } else {
      // Se não estiver logado, redireciona
      window.location.href = "login.html";
    }
  });

  // Logout
  window.logout = () => {
    signOut(auth).then(() => {
      window.location.href = "login.html";
    });
  };

  // Agendar aula
  window.scheduleClass = async () => {
    const user = auth.currentUser;
    if (!user) return alert("Faça login primeiro!");

    const date = document.getElementById("classDate").value;
    const time = document.getElementById("classTime").value;

    if (!date || !time) return alert("Escolha data e hora");

    const userDoc = doc(db, "students", user.uid);
    const docSnap = await getDoc(userDoc);
    const data = docSnap.data();

    const newClass = { date, time };
    const updatedClasses = [...data.classes, newClass];

    await updateDoc(userDoc, { classes: updatedClasses });

    alert(`Aula agendada para ${date} às ${time}`);
  };

  // Pagamentos (simulação)
  window.pay = async method => {
    const user = auth.currentUser;
    if (!user) return alert("Faça login primeiro!");

    const userDoc = doc(db, "students", user.uid);
    const docSnap = await getDoc(userDoc);
    const data = docSnap.data();

    let amount = 10; // valor fixo por aula, depois podes adicionar pacotes

    if (method === "paypal") alert("Simulação: Pagamento via PayPal");
    if (method === "card") alert("Simulação: Pagamento com Cartão");

    await updateDoc(userDoc, { balance: data.balance + amount });
    balanceEl.innerText = (data.balance + amount).toFixed(2);
  };
</script>

</body>
</html>

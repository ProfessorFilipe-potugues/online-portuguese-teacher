<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Área do Aluno</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin:0;
      font-family:'Segoe UI', sans-serif;
      background:#f4f7fb;
    }

    header {
      background:#0d6efd;
      color:#fff;
      padding:20px;
      text-align:center;
    }

    header h1 {
      margin: 0;
      font-size: 2em;
    }

    header p {
      margin: 10px 0 0 0;
      opacity: 0.9;
    }

    .container {
      max-width:1100px;
      margin:auto;
      padding:30px 20px;
    }

    h2 {
      margin-bottom:20px;
      color: #333;
    }

    .cards {
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(260px,1fr));
      gap:20px;
    }

    .card {
      background:#fff;
      padding:25px;
      border-radius:16px;
      box-shadow:0 8px 20px rgba(0,0,0,0.1);
      transition: 0.3s;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow:0 12px 28px rgba(0,0,0,0.15);
    }

    .card h3 {
      color:#0d6efd;
      margin-top: 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .card p {
      color: #666;
      line-height: 1.6;
    }

    .btn {
      display:inline-block;
      margin-top:15px;
      padding:10px 20px;
      background:#0d6efd;
      color:#fff;
      border-radius:8px;
      font-weight:bold;
      text-decoration:none;
      transition: 0.3s;
    }

    .btn:hover {
      background:#6610f2;
      transform: translateY(-2px);
    }

    .logout-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(255,255,255,0.2);
      color: white;
      border: 1px solid rgba(255,255,255,0.3);
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      transition: 0.3s;
    }

    .logout-btn:hover {
      background: rgba(255,255,255,0.3);
    }

    @media (max-width: 600px) {
      .cards {
        grid-template-columns: 1fr;
      }

      header h1 {
        font-size: 1.5em;
      }

      .logout-btn {
        position: static;
        display: block;
        margin: 15px auto 0;
        width: fit-content;
      }
    }
  </style>
</head>

<body>

<header>
  <button class="logout-btn" onclick="logout()">Sair</button>
  <h1>Área do Aluno</h1>
  <p>Bem-vindo às suas aulas de Português</p>
</header>

<div class="container">
  <h2>O que deseja fazer?</h2>

  <div class="cards">

    <div class="card">
      <h3>📅 Próxima Aula</h3>
      <p>Ainda não há aulas marcadas.</p>
      <a class="btn" href="marcar-aula.html">Marcar Aula</a>
    </div>

    <div class="card">
      <h3>📚 Meu Plano</h3>
      <p>Consulte seus planos e pagamentos.</p>
      <a class="btn" href="pricing.html">Ver Planos</a>
    </div>

    <div class="card">
      <h3>💬 Falar com o Professor</h3>
      <p>Tire dúvidas e peça apoio.</p>
      <a class="btn" href="chat.html?userId=3Oj4YuYGewO3O9DqPxWrjBln7MG3">Chat na Plataforma</a>
      <a class="btn" href="https://wa.me/258853131045" target="_blank" style="background: #25d366; margin-top: 10px;">WhatsApp</a>
    </div>

  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBpCB1ePW49VgUvON9LSNEBsTQcKXoAg40",
    authDomain: "portuguese-teacher-platf-68bc5.firebaseapp.com",
    projectId: "portuguese-teacher-platf-68bc5"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  // Verifica autenticação
  onAuthStateChanged(auth, (user) => {
    if (!user) {
      window.location.href = "login.html";
    }
  });

  // Função de logout
  window.logout = async () => {
    if (confirm("Tem certeza que deseja sair?")) {
      try {
        await signOut(auth);
        window.location.href = "index.html";
      } catch (error) {
        console.error(error);
        alert("Erro ao sair");
      }
    }
  };
</script>

</body>
</html>

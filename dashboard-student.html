<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Área do Aluno</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin:0;
      font-family:'Segoe UI', sans-serif;
      background:#f4f7fb;
    }

    header {
      background:#0d6efd;
      color:#fff;
      padding:20px;
      text-align:center;
    }

    .container {
      max-width:1100px;
      margin:auto;
      padding:30px 20px;
    }

    h2 {
      margin-bottom:20px;
    }

    .cards {
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(260px,1fr));
      gap:20px;
    }

    .card {
      background:#fff;
      padding:25px;
      border-radius:16px;
      box-shadow:0 8px 20px rgba(0,0,0,0.1);
    }

    .card h3 {
      color:#0d6efd;
    }

    .btn {
      display:inline-block;
      margin-top:15px;
      padding:10px 20px;
      background:#0d6efd;
      color:#fff;
      border-radius:8px;
      font-weight:bold;
      text-decoration:none;
    }

    .btn:hover {
      background:#6610f2;
    }
  </style>
</head>

<body>

<header>
  <h1>Área do Aluno</h1>
  <p>Bem-vindo às suas aulas de Português</p>
</header>

<div class="container">
  <h2>O que deseja fazer?</h2>

  <div class="cards">

    <div class="card">
      <h3>📅 Próxima Aula</h3>
      <p>Ainda não há aulas marcadas.</p>
      <a class="btn" href="marcar-aula.html">Marcar Aula</a>
    </div>

    <div class="card">
      <h3>📚 Meu Plano</h3>
      <p>Consulte seus planos e pagamentos.</p>
      <a class="btn" href="pricing.html">Ver Planos</a>
    </div>

    <div class="card">
      <h3>💬 Falar com o Professor</h3>
      <p>Tire dúvidas e peça apoio.</p>
      <a class="btn" href="https://wa.me/258000000000" target="_blank">WhatsApp</a>
    </div>

  </div>
</div>

</body>
</html>

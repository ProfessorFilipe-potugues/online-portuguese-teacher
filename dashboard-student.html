<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Dashboard do Estudante</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/main.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background:#f4f6f8;
}

header {
  background:#0d6efd;
  color:white;
  padding:15px 30px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

header button {
  background:#dc3545;
  border:none;
  color:white;
  padding:6px 15px;
  border-radius:5px;
  cursor:pointer;
}

.container {
  max-width:1100px;
  margin:auto;
  padding:25px;
}

.card {
  background:white;
  padding:25px;
  border-radius:10px;
  margin-bottom:25px;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.teacher {
  display:flex;
  gap:20px;
}

.teacher img {
  width:90px;
  height:90px;
  border-radius:50%;
}

.badge {
  display:inline-block;
  background:#e7f1ff;
  color:#0d6efd;
  padding:5px 10px;
  border-radius:15px;
  font-size:13px;
  margin:4px 4px 0 0;
}

.grid {
  display:flex;
  gap:25px;
  flex-wrap:wrap;
}

.left { flex:2; }
.right { flex:1; }

button.primary {
  width:100%;
  padding:14px;
  background:#0d6efd;
  color:white;
  border:none;
  border-radius:8px;
  font-size:16px;
  cursor:pointer;
  margin-top:15px;
}

#calendar {
  margin-top:20px;
}
</style>
</head>

<body>

<header>
  <h2 id="welcome">Olá!</h2>
  <button id="logout">Sair</button>
</header>

<div class="container">

  <div class="card grid">

    <!-- ESQUERDA -->
    <div class="left">
      <div class="teacher">
        <img src="filipe.jpg">

        <div>
          <h3>Filipe Monteiro 🇲🇿</h3>
          <p><strong>Professor de Português</strong></p>

          <span class="badge">Aulas Personalizadas</span>
          <span class="badge">Flexível</span>
          <span class="badge">Experiência Internacional</span>
        </div>
      </div>

      <h4>Sobre o professor</h4>
      <p>
        Professor nativo de português, focado em aulas práticas,
        conversação e preparação para exames.
      </p>

      <button class="primary" onclick="window.location.href='marcar-aula.html'">
        Agendar Aula Experimental
      </button>
    </div>

    <!-- DIREITA -->
    <div class="right">
      <h4>Minhas Aulas</h4>
      <div id="calendar"></div>
    </div>

  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, collection, getDocs, query, where, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

/* 🔥 FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyBpCB1ePW49VgUvON9LSNEBsTQcKXoAg40",
  authDomain: "portuguese-teacher-platf-68bc5.firebaseapp.com",
  projectId: "portuguese-teacher-platf-68bc5"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let calendar;

/* 🔐 AUTENTICAÇÃO */
onAuthStateChanged(auth, async (user) => {
  if (!user) {
    window.location.href = "login.html";
    return;
  }

  const userDoc = await getDoc(doc(db, "users", user.uid));

  if (!userDoc.exists() || userDoc.data().role !== "student") {
    window.location.href = "login.html";
    return;
  }

  document.getElementById("welcome").innerText =
    `Olá, ${userDoc.data().name}!`;

  loadMyClasses(user.uid);
});

/* 🚪 LOGOUT */
document.getElementById("logout").onclick = () =>
  signOut(auth).then(() => window.location.href = "login.html");

/* 📚 AULAS DO ESTUDANTE */
async function loadMyClasses(studentId) {

  const snap = await getDocs(
    query(
      collection(db, "appointments"),
      where("studentId", "==", studentId)
    )
  );

  const events = [];

  snap.forEach(docSnap => {
    const a = docSnap.data();

    events.push({
      title:
        a.type === "experimental"
          ? "Aula Experimental"
          : "Aula",
      start: `${a.date}T${a.start}`,
      end: `${a.date}T${a.end}`
    });
  });

  renderCalendar(events);
}

/* 🗓️ CALENDÁRIO */
function renderCalendar(events) {
  const el = document.getElementById("calendar");

  calendar = new FullCalendar.Calendar(el, {
    initialView: "dayGridMonth",
    height: 400,
    events: events
  });

  calendar.render();
}
</script>

</body>
</html>

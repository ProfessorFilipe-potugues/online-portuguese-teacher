<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Dashboard do Aluno</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/main.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/main.min.js"></script>

<style>
body { font-family: Arial,sans-serif; margin:0; background:#f4f6f8; }
header {
  background:#0d6efd;
  color:white;
  padding:15px 30px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
header button {
  background:red;
  border:none;
  color:white;
  padding:6px 15px;
  border-radius:5px;
  cursor:pointer;
}
.container { max-width:1200px; margin:auto; padding:20px; }
.card {
  background:white;
  padding:20px;
  border-radius:10px;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
  margin-bottom:20px;
}
label { display:block; margin-top:10px; }
input, button {
  padding:10px;
  width:100%;
  margin-top:5px;
}
button {
  background:#0d6efd;
  color:white;
  border:none;
  cursor:pointer;
}
#calendar { margin-top:20px; }
</style>
</head>

<body>

<header>
  <h2 id="welcome">Bem-vindo</h2>
  <button id="logout">Sair</button>
</header>

<div class="container">

  <div class="card">
    <h3>Marcar Aula</h3>

    <label>Data</label>
    <input type="date" id="date">

    <label>Hora de início</label>
    <input type="time" id="start">

    <button onclick="bookClass()">Confirmar Marcação</button>
  </div>

  <div class="card">
    <h3>Calendário de Aulas</h3>
    <div id="calendar"></div>
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import {
  getFirestore,
  collection,
  addDoc,
  query,
  where,
  getDocs,
  doc,
  getDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

/* 🔥 FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyBpCB1ePW49VgUvON9LSNEBsTQcKXoAg40",
  authDomain: "portuguese-teacher-platf-68bc5.firebaseapp.com",
  projectId: "portuguese-teacher-platf-68bc5"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* 🧑‍🏫 UID FIXO DO PROFESSOR */
const TEACHER_ID = "3Oj4YuYGewO3O9DqPxWrjBln7MG3";

let currentUser;
let calendar;

/* 🔐 AUTH */
onAuthStateChanged(auth, async (user) => {
  if (!user) {
    window.location.href = "login.html";
    return;
  }

  currentUser = user;

  const userDoc = await getDoc(doc(db, "users", user.uid));
  const data = userDoc.data();

  document.getElementById("welcome").innerText =
    `Bem-vindo, ${data.name || user.email}`;

  loadCalendar();
});

/* 🚪 LOGOUT */
document.getElementById("logout").onclick = () =>
  signOut(auth).then(() => window.location.href = "login.html");

/* 📅 CALENDAR */
async function loadCalendar() {
  const calendarEl = document.getElementById("calendar");

  calendar = new FullCalendar.Calendar(calendarEl, {
    initialView: "dayGridMonth",
    height: 500,
    events: []
  });

  calendar.render();

  const q = query(
    collection(db, "classes"),
    where("studentId", "==", currentUser.uid)
  );

  const snap = await getDocs(q);
  const events = [];

  snap.forEach(docSnap => {
    const c = docSnap.data();
    events.push({
      title: "Aula de Português",
      start: `${c.date}T${c.start}`,
      end: `${c.date}T${c.end}`
    });
  });

  calendar.addEventSource(events);
}

/* 📘 MARCAR AULA */
window.bookClass = async () => {
  const date = document.getElementById("date").value;
  const start = document.getElementById("start").value;

  if (!date || !start) {
    alert("Seleciona data e hora");
    return;
  }

  const endHour = String(Number(start.split(":")[0]) + 1).padStart(2, "0");
  const end = `${endHour}:${start.split(":")[1]}`;

  await addDoc(collection(db, "classes"), {
    studentId: currentUser.uid,
    studentEmail: currentUser.email,
    teacherId: TEACHER_ID,
    date: date,
    start: start,
    end: end,
    createdAt: serverTimestamp()
  });

  alert("Aula marcada com sucesso!");
  calendar.removeAllEvents();
  loadCalendar();
};
</script>

</body>
</html>

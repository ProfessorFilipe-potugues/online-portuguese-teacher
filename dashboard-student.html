<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Dashboard do Aluno</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/main.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/main.min.js"></script>

<style>
body { font-family: Arial,sans-serif; margin:0; background:#f4f6f8; }
header {
  background:#0d6efd;
  color:white;
  padding:15px 30px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
header button {
  background:red;
  border:none;
  color:white;
  padding:6px 15px;
  border-radius:5px;
  cursor:pointer;
}
.container { max-width:1200px; margin:auto; padding:20px; }
.top-cards {
  display:flex;
  gap:20px;
  flex-wrap:wrap;
  margin-bottom:20px;
}
.card {
  background:white;
  flex:1 1 200px;
  padding:20px;
  border-radius:10px;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
  text-align:center;
}
.card h2 { margin:0 0 10px; font-size:16px; color:#0d6efd; }
.card p { margin:0; font-size:20px; font-weight:bold; }
.main {
  display:flex;
  gap:20px;
  flex-wrap:wrap;
}
.left, .right {
  background:white;
  padding:20px;
  border-radius:10px;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
}
.left { flex:1 1 350px; }
.right { flex:2 1 600px; }
#calendar { margin-top:20px; }
@media(max-width:900px){
  .main { flex-direction:column; }
}
</style>
</head>

<body>

<header>
  <h2 id="welcome">Bem-vindo</h2>
  <button id="logout">Sair</button>
</header>

<div class="container">

  <div class="top-cards">
    <div class="card">
      <h2>Saldo</h2>
      <p id="balance">$0</p>
    </div>
    <div class="card">
      <h2>Próxima Aula</h2>
      <p id="nextClass">A definir</p>
    </div>
    <div class="card">
      <h2>Professor</h2>
      <p>Filipe Monteiro</p>
    </div>
  </div>

  <div class="main">
    <div class="left">
      <h3>Informações</h3>
      <p>Aqui podes acompanhar as tuas aulas, saldo e progresso.</p>
    </div>

    <div class="right">
      <h3>Calendário de Aulas</h3>
      <div id="calendar"></div>
    </div>
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, collection, query, where, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

/* 🔥 FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyBpCB1ePW49VgUvON9LSNEBsTQcKXoAg40",
  authDomain: "portuguese-teacher-platf-68bc5.firebaseapp.com",
  projectId: "portuguese-teacher-platf-68bc5"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let calendar;

/* 🔐 AUTH */
onAuthStateChanged(auth, async (user) => {
  if (!user) {
    window.location.href = "login.html";
    return;
  }

  const userDoc = await getDoc(doc(db, "users", user.uid));
  const data = userDoc.exists() ? userDoc.data() : {};

  document.getElementById("welcome").innerText =
    `Bem-vindo, ${data.name || user.email}`;

  document.getElementById("balance").innerText =
    "$" + (data.balance || 0);

  loadCalendar(user.uid);
});

/* 🚪 LOGOUT */
document.getElementById("logout").onclick = () =>
  signOut(auth).then(() => window.location.href = "login.html");

/* 📅 CALENDAR */
async function loadCalendar(studentId) {
  const calendarEl = document.getElementById("calendar");

  calendar = new FullCalendar.Calendar(calendarEl, {
    initialView: "dayGridMonth",
    height: 500,
    events: []
  });

  calendar.render();

  const q = query(
    collection(db, "classes"),
    where("studentId", "==", studentId)
  );

  const snap = await getDocs(q);
  const events = [];
  let nextClass = null;

  snap.forEach(docSnap => {
    const c = docSnap.data();
    const start = `${c.date}T${c.start}`;
    events.push({
      title: "Aula de Português",
      start: start,
      end: `${c.date}T${c.end}`
    });

    if (!nextClass || new Date(start) < new Date(nextClass)) {
      nextClass = start;
    }
  });

  calendar.addEventSource(events);

  if (nextClass) {
    document.getElementById("nextClass").innerText =
      new Date(nextClass).toLocaleString("pt-PT");
  }
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Learn Portuguese | Dashboard do Aluno</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #f4f6f8;
}
header {
  background: #0d6efd;
  color: white;
  padding: 15px 30px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
header button {
  background: red;
  border: none;
  color: white;
  padding: 6px 15px;
  border-radius: 5px;
  cursor: pointer;
}
.container {
  max-width: 1300px;
  margin: auto;
  padding: 20px;
}
h1 {
  margin-bottom: 5px;
}
.subtitle {
  color: #555;
  margin-bottom: 20px;
}

/* FILTROS */
.filters {
  background: white;
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 20px;
}
.filters label {
  font-size: 14px;
  font-weight: bold;
}
.filters select,
.filters input {
  width: 100%;
  padding: 8px;
  margin: 5px 0 15px;
}

/* CARD PROFESSOR */
.teacher-card {
  background: white;
  border-radius: 12px;
  padding: 20px;
  display: flex;
  gap: 20px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}
.teacher-card img {
  width: 140px;
  height: 140px;
  border-radius: 50%;
  object-fit: cover;
}
.teacher-info {
  flex: 1;
}
.teacher-info h3 {
  margin: 0;
  color: #0d6efd;
}
.badges span {
  background: #e7f1ff;
  color: #0d6efd;
  padding: 4px 8px;
  border-radius: 6px;
  font-size: 12px;
  margin-right: 5px;
}
.teacher-meta {
  font-size: 14px;
  margin: 8px 0;
}
.teacher-price {
  text-align: right;
}
.teacher-price strong {
  font-size: 22px;
}
.teacher-price button {
  background: #0d6efd;
  border: none;
  color: white;
  padding: 10px 18px;
  border-radius: 8px;
  cursor: pointer;
  margin-top: 10px;
}
.teacher-price button:hover {
  background: #0b5ed7;
}
</style>
</head>

<body>

<header>
  <h2>Learn Portuguese</h2>
  <button id="logout">Sair</button>
</header>

<div class="container">

  <h1>Learn Portuguese</h1>
  <div class="subtitle">
    Aulas de português online com professor particular
  </div>

  <!-- FILTROS (VISUAIS) -->
  <div class="filters">
    <label>Quero aprender</label>
    <select>
      <option>Português</option>
    </select>

    <label>Preço por aula</label>
    <select>
      <option>$ 3–40+</option>
    </select>

    <label>Disponibilidade</label>
    <select>
      <option>Qualquer horário</option>
    </select>

    <label>Pesquisar</label>
    <input type="text" placeholder="Pesquisar por nome ou palavra-chave">
  </div>

  <!-- CARD DO PROFESSOR -->
  <div class="teacher-card">
    <img src="filipe.jpg" alt="Professor Filipe Monteiro">

    <div class="teacher-info">
      <h3 id="teacherName">---</h3>

      <div class="badges">
        <span>Professor profissional</span>
        <span>Verificado</span>
      </div>

      <div class="teacher-meta">
        📍 Moçambique<br>
        🗣️ Português (Nativo), Inglês
      </div>

      <p id="teacherBio">
        ---
      </p>
    </div>

    <div class="teacher-price">
      <strong>$ 10</strong>
      <div>Aula de 50 minutos</div>
      <button onclick="agendar()">Agendar aula</button>
    </div>
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBpCB1ePW49VgUvON9LSNEBsTQcKXoAg40",
  authDomain: "portuguese-teacher-platf-68bc5.firebaseapp.com",
  projectId: "portuguese-teacher-platf-68bc5"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* UID DO PROFESSOR */
const TEACHER_ID = "3Oj4YuYGewO3O9DqPxWrjBln7MG3";

/* AUTH */
onAuthStateChanged(auth, async (user) => {
  if (!user) {
    window.location.href = "login.html";
    return;
  }
  loadTeacher();
});

/* LOGOUT */
document.getElementById("logout").onclick = () =>
  signOut(auth).then(() => window.location.href = "login.html");

/* CARREGAR PROFESSOR */
async function loadTeacher() {
  const snap = await getDoc(doc(db, "users", TEACHER_ID));
  if (!snap.exists()) return;

  const t = snap.data();
  document.getElementById("teacherName").innerText = t.name;
  document.getElementById("teacherBio").innerText =
    "Aprende português de forma clara, prática e confiante. Aulas personalizadas para conversação, gramática e objetivos profissionais.";
}

/* AGENDAR */
window.agendar = () => {
  window.location.href = "marcar-aula.html";
};
</script>

</body>
</html>

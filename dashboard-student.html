<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Dashboard do Aluno</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/main.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/main.min.js"></script>

<style>
/* (ESTILOS IGUAIS AO TEU – SEM ALTERAÇÕES) */
body { font-family: Arial,sans-serif; margin:0; background:#f4f6f8; }
header {
  background:#0d6efd;
  color:white;
  padding:15px 30px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
header button {
  background:red;
  border:none;
  color:white;
  padding:6px 15px;
  border-radius:5px;
  cursor:pointer;
}
.container { max-width:1200px; margin:auto; padding:20px; }
</style>
</head>

<body>

<header>
  <h2 id="welcome">Bem-vindo</h2>
  <button id="logout">Sair</button>
</header>

<div class="container">
  <!-- RESTANTE DO TEU HTML IGUAL -->
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBpCB1ePW49VgUvON9LSNEBsTQcKXoAg40",
  authDomain: "portuguese-teacher-platf-68bc5.firebaseapp.com",
  projectId: "portuguese-teacher-platf-68bc5"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

onAuthStateChanged(auth, async (user)=>{
  if(!user){
    window.location.href="login.html";
    return;
  }

  const snap = await getDoc(doc(db,"users",user.uid));
  if(!snap.exists() || snap.data().role!=="student"){
    window.location.href="login.html";
    return;
  }
});

logout.onclick = ()=>signOut(auth).then(()=>location.href="login.html");
</script>

</body>
</html>

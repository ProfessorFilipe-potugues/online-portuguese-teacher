<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Login - Português Online</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: Arial, sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  background:#f4f6f8;
  margin:0;
}
.login-container {
  background:white;
  padding:40px;
  border-radius:10px;
  box-shadow:0 5px 15px rgba(0,0,0,.2);
  width:350px;
  text-align:center;
}
input, select {
  width:100%;
  padding:12px;
  margin-top:10px;
}
button {
  width:100%;
  padding:12px;
  margin-top:15px;
  border:none;
  cursor:pointer;
  color:white;
}
.login { background:#0d6efd; }
.signup { background:#198754; }
</style>
</head>

<body>

<div class="login-container">
  <h2>Login / Criar Conta</h2>

  <select id="role">
    <option value="student">Aluno</option>
    <option value="teacher">Professor</option>
  </select>

  <input id="email" type="email" placeholder="Email">
  <input id="password" type="password" placeholder="Senha">

  <button class="login" id="loginBtn">Entrar</button>
  <button class="signup" id="signupBtn">Criar Conta</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getAuth,
  signInWithEmailAndPassword,
  createUserWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import {
  getFirestore,
  doc,
  setDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

/* 🔥 FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyBpCB1ePW49VgUvON9LSNEBsTQcKXoAg40",
  authDomain: "portuguese-teacher-platf-68bc5.firebaseapp.com",
  projectId: "portuguese-teacher-platf-68bc5"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* 🔐 LOGIN */
loginBtn.onclick = async () => {
  const email = email.value;
  const password = password.value;

  try {
    await signInWithEmailAndPassword(auth, email, password);
 window.location.href = "dashboard-student.html";

  } catch (e) {
    alert("Erro no login");
  }
};

/* 🆕 SIGNUP */
signupBtn.onclick = async () => {
  const emailVal = email.value;
  const passwordVal = password.value;
  const roleVal = role.value;

  try {
    const cred = await createUserWithEmailAndPassword(
      auth,
      emailVal,
      passwordVal
    );

    /* 🔴 CRIA DOCUMENTO IMEDIATAMENTE */
    await setDoc(doc(db, "users", cred.user.uid), {
      email: emailVal,
      role: roleVal,
      completedProfile: false,
      createdAt: serverTimestamp()
    });

    /* 🔁 REDIRECIONA FORÇADO */
   if (roleVal === "student") {
  window.location.href = "cadastro-aluno.html";
} else {
  window.location.href = "dashboard-teacher.html";
}

  } catch (e) {
    alert("Erro ao criar conta: " + e.message);
  }
};
</script>

</body>
</html>

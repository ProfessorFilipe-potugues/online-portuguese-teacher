<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Login - Professor de Português Online</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f4f6f8; }
    .login-container { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); width: 350px; }
    input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 5px; border: 1px solid #ccc; }
    button { width: 100%; padding: 12px; background: #0d6efd; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; }
    button:hover { background: #084298; }
    .switch { text-align: center; margin-top: 15px; }
    .switch a { color: #0d6efd; text-decoration: none; }
  </style>
</head>
<body>

<div class="login-container">
  <h2>Login / Criar Conta</h2>
  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Senha">
  <button id="login-btn">Entrar</button>
  <button id="signup-btn">Criar Conta</button>
  <div class="switch">
    <a href="pricing.html">Voltar para Preços</a>
  </div>
</div>

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "SUA_API_KEY",
    authDomain: "SEU_PROJECT.firebaseapp.com",
    projectId: "SEU_PROJECT",
    storageBucket: "SEU_PROJECT.appspot.com",
    messagingSenderId: "SUA_MESSAGING_ID",
    appId: "SEU_APP_ID"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  const form = document.getElementById("loginForm");

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const email = form.email.value;
    const password = form.password.value;

    if (form.dataset.action === "signup") {
      createUserWithEmailAndPassword(auth, email, password)
        .then(userCredential => alert("Conta criada com sucesso!"))
        .catch(error => alert(error.message));
    } else {
      signInWithEmailAndPassword(auth, email, password)
        .then(userCredential => alert("Login realizado!"))
        .catch(error => alert(error.message));
    }
  });
</script>


</body>
</html>

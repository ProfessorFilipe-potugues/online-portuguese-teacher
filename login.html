<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Login - Professor de Português Online</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f4f6f8; }
    .login-container { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); width: 350px; }
    input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 5px; border: 1px solid #ccc; }
    button { width: 100%; padding: 12px; background: #0d6efd; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; }
    button:hover { background: #084298; }
    .switch { text-align: center; margin-top: 15px; }
    .switch a { color: #0d6efd; text-decoration: none; }
  </style>
</head>
<body>

<div class="login-container">
  <h2>Login / Criar Conta</h2>
  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Senha">
  <button id="login-btn">Entrar</button>
  <button id="signup-btn">Criar Conta</button>
  <div class="switch">
    <a href="pricing.html">Voltar para Preços</a>
  </div>
</div>

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
  import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBpCB1ePW49VgUvON9LSNEBsTQcKXoAg40",
    authDomain: "portuguese-teacher-platf-68bc5.firebaseapp.com",
    projectId: "portuguese-teacher-platf-68bc5",
    storageBucket: "portuguese-teacher-platf-68bc5.firebasestorage.app",
    messagingSenderId: "653549982098",
    appId: "1:653549982098:web:42bba4cc75ca56bc69314b"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const emailInput = document.getElementById("email");
  const passwordInput = document.getElementById("password");
  const loginBtn = document.getElementById("login-btn");
  const signupBtn = document.getElementById("signup-btn");

  signupBtn.addEventListener("click", async () => {
    try {
      const userCredential = await createUserWithEmailAndPassword(auth, emailInput.value, passwordInput.value);
      const user = userCredential.user;
      // Cria documento do usuário no Firestore com saldo inicial 0
      await setDoc(doc(db, "users", user.uid), { email: user.email, balance: 0 });
      alert("Conta criada com sucesso!");
      window.location.href = "dashboard.html";
    } catch(error) {
      alert(error.message);
    }
  });

  loginBtn.addEventListener("click", async () => {
    try {
      await signInWithEmailAndPassword(auth, emailInput.value, passwordInput.value);
      alert("Login realizado com sucesso!");
      window.location.href = "dashboard.html";
    } catch(error) {
      alert(error.message);
    }
  });
</script>

</body>
</html>

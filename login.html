<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Login | Português Online</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f4f6f8;
      margin: 0;
    }

    .login-container {
      background: white;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0,0,0,.2);
      width: 350px;
      text-align: center;
    }

    h2 {
      margin-bottom: 20px;
    }

    input, select {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      font-size: 14px;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      border: none;
      cursor: pointer;
      color: white;
      font-size: 15px;
      border-radius: 6px;
    }

    .login {
      background: #0d6efd;
    }

    .signup {
      background: #198754;
    }
  </style>
</head>

<body>

<div class="login-container">
  <h2>Login / Criar Conta</h2>

  <select id="role">
    <option value="student">Aluno</option>
    <option value="teacher">Professor</option>
  </select>

  <input id="email" type="email" placeholder="Email" required>
  <input id="password" type="password" placeholder="Senha" required>

  <button class="login" id="loginBtn">Entrar</button>
  <button class="signup" id="signupBtn">Criar Conta</button>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import {
    getAuth,
    signInWithEmailAndPassword,
    createUserWithEmailAndPassword
  } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
  import {
    getFirestore,
    doc,
    setDoc,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  /* 🔥 FIREBASE CONFIG */
  const firebaseConfig = {
    apiKey: "AIzaSyBpCB1ePW49VgUvON9LSNEBsTQcKXoAg40",
    authDomain: "portuguese-teacher-platf-68bc5.firebaseapp.com",
    projectId: "portuguese-teacher-platf-68bc5"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  /* 🔗 ELEMENTOS DO DOM */
  const emailInput = document.getElementById("email");
  const passwordInput = document.getElementById("password");
  const roleSelect = document.getElementById("role");
  const loginBtn = document.getElementById("loginBtn");
  const signupBtn = document.getElementById("signupBtn");

  /* 🔐 LOGIN */
  loginBtn.addEventListener("click", async () => {
    const email = emailInput.value;
    const password = passwordInput.value;

    try {
      await signInWithEmailAndPassword(auth, email, password);
      window.location.href = "dashboard-student.html";
    } catch (error) {
      alert("Erro no login: " + error.message);
    }
  });

  /* 🆕 CRIAR CONTA */
  signupBtn.addEventListener("click", async () => {
    const email = emailInput.value;
    const password = passwordInput.value;
    const role = roleSelect.value;

    try {
      const cred = await createUserWithEmailAndPassword(auth, email, password);

      await setDoc(doc(db, "users", cred.user.uid), {
        email: email,
        role: role,
        completedProfile: false,
        createdAt: serverTimestamp()
      });

      if (role === "student") {
        window.location.href = "cadastro-aluno.html";
      } else {
        window.location.href = "dashboard-teacher.html";
      }

    } catch (error) {
      alert("Erro ao criar conta: " + error.message);
    }
  });
</script>

</body>
</html>

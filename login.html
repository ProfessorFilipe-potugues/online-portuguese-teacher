<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Entrar | Professor de Português Online</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin:0;
      font-family:'Segoe UI', sans-serif;
      background:linear-gradient(135deg, #0d6efd, #6610f2);
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .box {
      background:#fff;
      width:100%;
      max-width:420px;
      padding:35px;
      border-radius:16px;
      box-shadow:0 12px 30px rgba(0,0,0,0.2);
      text-align:center;
    }

    h1 {
      color:#0d6efd;
      margin-bottom:10px;
    }

    p {
      color:#666;
      margin-bottom:25px;
    }

    input {
      width:100%;
      padding:12px;
      margin-bottom:15px;
      border-radius:8px;
      border:1px solid #ccc;
      font-size:1em;
    }

    button {
      width:100%;
      padding:12px;
      background:#0d6efd;
      color:#fff;
      border:none;
      border-radius:8px;
      font-weight:bold;
      cursor:pointer;
      transition:0.3s;
    }

    button:hover {
      background:#6610f2;
    }

    .links {
      margin-top:15px;
      font-size:0.9em;
    }

    .links a {
      color:#0d6efd;
      text-decoration:none;
      font-weight:bold;
    }
  </style>
</head>

<body>

<div class="box">
  <h1>Entrar</h1>
  <p>Aceda à sua área de aulas</p>

  <input type="email" placeholder="Email">
  <input type="password" placeholder="Senha">

  <button>Entrar</button>

  <div class="links">
    <p>Não tem conta? <a href="signup-student.html">Criar conta</a></p>
  </div>
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Login | Professor de Português Online</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    .card {
      background: #fff;
      padding: 30px;
      width: 100%;
      max-width: 380px;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #0d6efd;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #0d6efd;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #084298;
    }

    .link {
      text-align: center;
      margin-top: 15px;
    }

    .link a {
      color: #0d6efd;
      text-decoration: none;
      font-size: 14px;
    }

    .msg {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Login / Criar Conta</h2>

    <input type="email" id="email" placeholder="Email" required>
    <input type="password" id="password" placeholder="Senha" required>

    <button onclick="register()">Criar Conta</button>
    <br><br>
    <button onclick="login()">Entrar</button>

    <div class="msg" id="message"></div>

    <div class="link">
      <a href="index.html">← Voltar ao site</a>
    </div>
  </div>

  <!-- 🔥 FIREBASE AUTH -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import {
      getAuth,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBpCB1ePW49VgUvON9LSNEBsTQcKXoAg40",
      authDomain: "portuguese-teacher-platform.firebaseapp.com",
      projectId: "portuguese-teacher-platform",
      storageBucket: "portuguese-teacher-platform.appspot.com",
      messagingSenderId: "653549982098",
      appId: "1:653549982098:web:42bba4cc75ca56bc69314b"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const message = document.getElementById("message");

    window.register = function () {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      createUserWithEmailAndPassword(auth, email, password)
        .then(() => {
          message.style.color = "green";
          message.innerText = "Conta criada com sucesso!";
        })
        .catch((error) => {
          message.style.color = "red";
          message.innerText = error.message;
        });
    };

    window.login = function () {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      signInWithEmailAndPassword(auth, email, password)
        .then(() => {
          message.style.color = "green";
          message.innerText = "Login realizado com sucesso!";
          // aqui depois vamos redirecionar para o painel do aluno
        })
        .catch((error) => {
          message.style.color = "red";
          message.innerText = error.message;
        });
    };
  </script>

</body>
</html>

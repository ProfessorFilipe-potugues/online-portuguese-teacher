<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Login - Português Online</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f4f6f8;
    }

    .login-container {
      background: white;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
      width: 350px;
      text-align: center;
    }

    input, select {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
    }

    button.login {
      background: #0d6efd;
      color: white;
    }

    button.signup {
      background: #198754;
      color: white;
    }
  </style>
</head>
<body>

<div class="login-container">
  <h2>Login / Criar Conta</h2>

  <select id="roleSelect">
    <option value="student">Aluno</option>
    <option value="teacher">Professor</option>
  </select>

  <input type="email" id="email" placeholder="Email" required>
  <input type="password" id="password" placeholder="Senha" required>

  <button class="login" id="loginBtn">Entrar</button>
  <button class="signup" id="signupBtn">Criar Conta</button>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
  import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBpCB1ePW49VgUvON9LSNEBsTQcKXoAg40",
    authDomain: "portuguese-teacher-platf-68bc5.firebaseapp.com",
    projectId: "portuguese-teacher-platf-68bc5"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const emailInput = document.getElementById("email");
  const passwordInput = document.getElementById("password");
  const roleSelect = document.getElementById("roleSelect");

  // 🔹 LOGIN
  document.getElementById("loginBtn").onclick = async () => {
    try {
      const cred = await signInWithEmailAndPassword(
        auth,
        emailInput.value,
        passwordInput.value
      );

      const userDocSnap = await getDoc(
        doc(db, "users", cred.user.uid)
      );

      if (!userDocSnap.exists()) {
        alert("Perfil não encontrado.");
        return;
      }

      const role = userDocSnap.data().role;

      if (role === "student") {
        window.location.href = "dashboard-student.html";
      } else {
        window.location.href = "dashboard-teacher.html";
      }

    } catch (err) {
      alert(err.message);
    }
  };

  // 🔹 SIGNUP
  document.getElementById("signupBtn").onclick = async () => {
    try {
      const cred = await createUserWithEmailAndPassword(
        auth,
        emailInput.value,
        passwordInput.value
      );

      await setDoc(doc(db, "users", cred.user.uid), {
        email: emailInput.value,
        role: roleSelect.value,
        balance: 0,
        createdAt: new Date()
      });

      // 👉 fluxo correto após criar conta
      if (roleSelect.value === "student") {
        window.location.href = "signup-student.html";
      } else {
        window.location.href = "dashboard-teacher.html";
      }

    } catch (err) {
      alert(err.message);
    }
  };
</script>

</body>
</html>

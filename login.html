<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Login | Português Online</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f4f6f8;
      margin: 0;
    }

    .login-container {
      background: white;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0,0,0,.2);
      width: 350px;
      text-align: center;
    }

    h2 {
      margin-bottom: 20px;
      color: #333;
    }

    label {
      display: block;
      text-align: left;
      margin-top: 15px;
      margin-bottom: 5px;
      color: #555;
      font-weight: 500;
    }

    input, select {
      width: 100%;
      padding: 12px;
      margin-top: 5px;
      font-size: 14px;
      border: 1px solid #ddd;
      border-radius: 6px;
      box-sizing: border-box;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #0d6efd;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      border: none;
      cursor: pointer;
      color: white;
      font-size: 15px;
      border-radius: 6px;
      font-weight: 500;
      transition: 0.3s;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .login {
      background: #0d6efd;
    }

    .login:hover:not(:disabled) {
      background: #0b5ed7;
    }

    .signup {
      background: #198754;
    }

    .signup:hover:not(:disabled) {
      background: #157347;
    }
  </style>
</head>

<body>

<div class="login-container">
  <h2>Login / Criar Conta</h2>

  <label for="email">Email:</label>
  <input id="email" type="email" placeholder="seu@email.com" required>

  <label for="password">Senha:</label>
  <input id="password" type="password" placeholder="Mínimo 6 caracteres" required>

  <button class="login" id="loginBtn">Entrar</button>
  
  <p style="margin: 20px 0; color: #999; font-size: 14px;">ou</p>
  
  <label for="role">Criar nova conta como:</label>
  <select id="role">
    <option value="student">Aluno</option>
    <option value="teacher">Professor</option>
  </select>
  
  <button class="signup" id="signupBtn">Criar Conta</button>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import {
    getAuth,
    signInWithEmailAndPassword,
    createUserWithEmailAndPassword
  } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
  import {
    getFirestore,
    doc,
    getDoc,
    setDoc,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  /* 🔥 FIREBASE CONFIG */
  const firebaseConfig = {
    apiKey: "AIzaSyBpCB1ePW49VgUvON9LSNEBsTQcKXoAg40",
    authDomain: "portuguese-teacher-platf-68bc5.firebaseapp.com",
    projectId: "portuguese-teacher-platf-68bc5"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  /* 🔗 ELEMENTOS DO DOM */
  const emailInput = document.getElementById("email");
  const passwordInput = document.getElementById("password");
  const roleSelect = document.getElementById("role");
  const loginBtn = document.getElementById("loginBtn");
  const signupBtn = document.getElementById("signupBtn");

  /* 🔐 LOGIN */
  loginBtn.addEventListener("click", async () => {
    const email = emailInput.value.trim();
    const password = passwordInput.value;

    if (!email || !password) {
      alert("Preencha todos os campos");
      return;
    }

    // Loading state
    loginBtn.disabled = true;
    loginBtn.textContent = "A entrar...";

    try {
      const userCredential = await signInWithEmailAndPassword(auth, email, password);
      
      // Busca o role do usuário no Firestore
      const userDoc = await getDoc(doc(db, "users", userCredential.user.uid));
      
      if (userDoc.exists()) {
        const userData = userDoc.data();
        const userRole = userData.role;
        
        // Redireciona conforme o role
        if (userRole === "teacher") {
          window.location.href = "dashboard-teacher.html";
        } else {
          window.location.href = "dashboard-student.html";
        }
      } else {
        // Se não encontrar dados, assume aluno
        window.location.href = "dashboard-student.html";
      }
      
    } catch (error) {
      console.error(error);
      let errorMsg = "Erro no login";
      
      if (error.code === "auth/user-not-found") {
        errorMsg = "Utilizador não encontrado";
      } else if (error.code === "auth/wrong-password") {
        errorMsg = "Senha incorreta";
      } else if (error.code === "auth/invalid-email") {
        errorMsg = "Email inválido";
      } else if (error.code === "auth/invalid-credential") {
        errorMsg = "Email ou senha incorretos";
      }
      
      alert(errorMsg);
      loginBtn.disabled = false;
      loginBtn.textContent = "Entrar";
    }
  });

  /* 🆕 CRIAR CONTA */
  signupBtn.addEventListener("click", async () => {
    const email = emailInput.value.trim();
    const password = passwordInput.value;
    const role = roleSelect.value;

    if (!email || !password) {
      alert("Preencha todos os campos");
      return;
    }

    if (password.length < 6) {
      alert("A senha deve ter pelo menos 6 caracteres");
      return;
    }

    // Loading state
    signupBtn.disabled = true;
    signupBtn.textContent = "A criar conta...";

    try {
      const cred = await createUserWithEmailAndPassword(auth, email, password);

      await setDoc(doc(db, "users", cred.user.uid), {
        email: email,
        role: role,
        completedProfile: false,
        createdAt: serverTimestamp()
      });

      if (role === "student") {
        window.location.href = "cadastro-aluno.html";
      } else {
        window.location.href = "dashboard-teacher.html";
      }

    } catch (error) {
      console.error(error);
      let errorMsg = "Erro ao criar conta";
      
      if (error.code === "auth/email-already-in-use") {
        errorMsg = "Este email já está em uso";
      } else if (error.code === "auth/invalid-email") {
        errorMsg = "Email inválido";
      } else if (error.code === "auth/weak-password") {
        errorMsg = "Senha muito fraca";
      }
      
      alert(errorMsg);
      signupBtn.disabled = false;
      signupBtn.textContent = "Criar Conta";
    }
  });

  // Permitir Enter para login
  passwordInput.addEventListener("keypress", (e) => {
    if (e.key === "Enter") {
      loginBtn.click();
    }
  });
</script>

</body>
</html>

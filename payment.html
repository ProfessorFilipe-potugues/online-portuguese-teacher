<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Pagamento – Aula Experimental</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin:0;
  font-family: Arial, sans-serif;
  background:#f4f6f8;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.box {
  background:white;
  padding:30px;
  width:360px;
  border-radius:10px;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
  text-align:center;
}

.price {
  font-size:34px;
  font-weight:bold;
  margin:15px 0;
}

button {
  width:100%;
  padding:14px;
  margin-top:12px;
  font-size:16px;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

.paypal {
  background:#ffc439;
}

.confirm {
  background:#0d6efd;
  color:white;
}
</style>
</head>

<body>

<div class="box">
  <h2>Aula Experimental</h2>
  <p>Pagamento único</p>

  <div class="price">$5 USD</div>

  <!-- PAYPAL -->
  <a
    href="https://www.paypal.com/paypalme/filipemonteirodjob/5"
    target="_blank"
  >
    <button class="paypal">Pagar com PayPal</button>
  </a>

  <button class="confirm" id="confirmPaid">
    Já paguei
  </button>

  <p style="font-size:13px; margin-top:10px; color:#666">
    Após pagar no PayPal, clique em “Já paguei”
  </p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import {
  getFirestore,
  addDoc,
  collection,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

/* 🔥 FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyBpCB1ePW49VgUvON9LSNEBsTQcKXoAg40",
  authDomain: "portuguese-teacher-platf-68bc5.firebaseapp.com",
  projectId: "portuguese-teacher-platf-68bc5"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* 🔐 AUTH */
let currentUser = null;
onAuthStateChanged(auth, (user) => {
  if (!user) {
    window.location.href = "login.html";
    return;
  }
  currentUser = user;
});

/* 📦 DADOS DO AGENDAMENTO (vindos do calendário) */
const params = new URLSearchParams(window.location.search);

const date  = params.get("date");
const start = params.get("start");
const end   = params.get("end");

document.getElementById("confirmPaid").onclick = async () => {

  if (!date || !start || !end) {
    alert("Dados do agendamento em falta.");
    return;
  }

  try {
    await addDoc(collection(db, "appointments"), {
      studentId: currentUser.uid,
      studentEmail: currentUser.email,
      teacherId: "3Oj4YuYGewO3O9DqPxWrjBln7MG3",
      date: date,
      start: start,
      end: end,
      type: "experimental",
      status: "confirmed",
      price: 5,
      paidVia: "paypal",
      createdAt: serverTimestamp()
    });

    alert("🎉 Pagamento confirmado! Aula marcada com sucesso.");
    window.location.href = "dashboard-student.html";

  } catch (err) {
    console.error(err);
    alert("Erro ao confirmar pagamento.");
  }
};
</script>

</body>
</html>

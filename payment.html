<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Pagamento – Aula Experimental</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin:0;
  font-family: Arial, sans-serif;
  background:#f4f6f8;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  padding: 20px;
}

.box {
  background:white;
  padding:30px;
  width:100%;
  max-width:400px;
  border-radius:10px;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
  text-align:center;
}

h2 {
  color: #333;
  margin-top: 0;
}

.info-box {
  background: #e7f3ff;
  padding: 15px;
  border-radius: 8px;
  margin: 20px 0;
  text-align: left;
  border-left: 4px solid #0d6efd;
}

.info-box strong {
  color: #004085;
}

.info-box p {
  margin: 8px 0;
  color: #004085;
  font-size: 14px;
}

.price {
  font-size:34px;
  font-weight:bold;
  margin:15px 0;
  color: #0d6efd;
}

button, a.button {
  width:100%;
  padding:14px;
  margin-top:12px;
  font-size:16px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  font-weight: 500;
  transition: 0.3s;
  display: block;
  text-decoration: none;
  text-align: center;
  box-sizing: border-box;
}

.paypal {
  background:#ffc439;
  color: #111;
}

.paypal:hover {
  background:#e6b033;
}

.confirm {
  background:#0d6efd;
  color:white;
}

.confirm:hover:not(:disabled) {
  background:#0b5ed7;
}

.confirm:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.note {
  font-size:13px;
  margin-top:15px;
  color:#666;
  line-height: 1.5;
}

.back-link {
  display: block;
  margin-top: 20px;
  color: #0d6efd;
  text-decoration: none;
  font-size: 14px;
}

.back-link:hover {
  text-decoration: underline;
}
</style>
</head>

<body>

<div class="box">
  <h2>🎓 Aula Experimental</h2>
  <p>Pagamento Único</p>

  <div class="info-box">
    <strong>📅 Horário Selecionado:</strong>
    <p id="scheduleInfo">A carregar...</p>
  </div>

  <div class="price">$5 USD</div>

  <!-- PAYPAL -->
  <a
    id="paypalLink"
    href="https://www.paypal.me/filipemonteirodjob/5"
    target="_blank"
    class="button paypal"
  >
    Pagar com PayPal
  </a>

  <button class="confirm" id="confirmPaid">
    Já paguei - Confirmar
  </button>

  <p class="note">
    ℹ️ Após pagar no PayPal, clique em "Já paguei" para confirmar a aula.
  </p>

  <a href="marcar-aula.html" class="back-link">← Voltar para selecionar outro horário</a>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import {
  getFirestore,
  addDoc,
  collection,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

/* 🔥 FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyBpCB1ePW49VgUvON9LSNEBsTQcKXoAg40",
  authDomain: "portuguese-teacher-platf-68bc5.firebaseapp.com",
  projectId: "portuguese-teacher-platf-68bc5"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const TEACHER_ID = "3Oj4YuYGewO3O9DqPxWrjBln7MG3";

/* 🔐 AUTH */
let currentUser = null;
onAuthStateChanged(auth, (user) => {
  if (!user) {
    window.location.href = "login.html";
    return;
  }
  currentUser = user;
});

/* 📦 DADOS DO AGENDAMENTO (vindos do calendário) */
const params = new URLSearchParams(window.location.search);
const date  = params.get("date");
const start = params.get("start");
const end   = params.get("end");

// Valida se os dados existem
if (!date || !start || !end) {
  alert("Dados do agendamento em falta. Redirecionando...");
  window.location.href = "marcar-aula.html";
} else {
  // Formata e mostra as informações
  const dateObj = new Date(date + "T" + start);
  const dateFormatted = dateObj.toLocaleDateString('pt-PT', {
    day: '2-digit',
    month: 'long',
    year: 'numeric'
  });
  
  document.getElementById("scheduleInfo").innerHTML = `
    <strong>Data:</strong> ${dateFormatted}<br>
    <strong>Horário:</strong> ${start} - ${end}
  `;
}

/* ✅ CONFIRMAR PAGAMENTO */
document.getElementById("confirmPaid").onclick = async () => {

  if (!date || !start || !end) {
    alert("Dados do agendamento em falta.");
    return;
  }

  const confirmBtn = document.getElementById("confirmPaid");
  
  if (!confirm("Confirma que já realizou o pagamento de $5 no PayPal?")) {
    return;
  }

  confirmBtn.disabled = true;
  confirmBtn.textContent = "A confirmar...";

  try {
    // Cria o agendamento no Firestore
    await addDoc(collection(db, "appointments"), {
      studentId: currentUser.uid,
      studentEmail: currentUser.email,
      teacherId: TEACHER_ID,
      date: date,
      start: start,
      end: end,
      type: "experimental",
      status: "confirmed",
      price: 5,
      currency: "USD",
      paidVia: "paypal",
      createdAt: serverTimestamp()
    });

    alert("🎉 Pagamento confirmado! Aula marcada com sucesso.\n\nEm breve receberás um email de confirmação.");
    window.location.href = "dashboard-student.html";

  } catch (err) {
    console.error(err);
    alert("Erro ao confirmar pagamento. Tenta novamente ou contacta o suporte.");
    confirmBtn.disabled = false;
    confirmBtn.textContent = "Já paguei - Confirmar";
  }
};
</script>

</body>
</html>

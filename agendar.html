<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Agendar Aula Experimental</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/main.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>

<style>
body { margin:0; font-family:Arial; background:#f4f6f8; }
header { background:#0d6efd; color:white; padding:15px 30px; }
.container { max-width:900px; margin:auto; padding:25px; }
.card { background:white; padding:25px; border-radius:10px; }
button {
  width:100%; padding:14px; background:#0d6efd; color:white;
  border:none; border-radius:8px; font-size:16px; margin-top:15px;
}
</style>
</head>

<body>

<header>Agendar Aula Experimental</header>

<div class="container">
  <div class="card">
    <p>Seleciona um horário:</p>
    <div id="calendar"></div>
    <button id="confirm">Continuar para pagamento ($5)</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, addDoc, collection, serverTimestamp } from
"https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBpCB1ePW49VgUvON9LSNEBsTQcKXoAg40",
  authDomain: "portuguese-teacher-platf-68bc5.firebaseapp.com",
  projectId: "portuguese-teacher-platf-68bc5"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;
let selectedSlot = null;

onAuthStateChanged(auth, user => {
  if (!user) window.location.href = "login.html";
  currentUser = user;
});

const calendar = new FullCalendar.Calendar(
  document.getElementById("calendar"), {
    initialView:"timeGridWeek",
    height:400,
    selectable:true,
    slotMinTime:"08:00:00",
    slotMaxTime:"20:00:00",
    select(info){ selectedSlot = info; }
});
calendar.render();

document.getElementById("confirm").onclick = async () => {
  if (!selectedSlot) {
    alert("Seleciona um horário.");
    return;
  }

  const paymentRef = await addDoc(collection(db,"payments"),{
    studentId: currentUser.uid,
    teacherId: "3Oj4YuYGewO3O9DqPxWrjBln7MG3",
    amount: 5,
    currency: "USD",
    type: "trial",
    status: "pending",
    slot:{
      date: selectedSlot.startStr.split("T")[0],
      start: selectedSlot.startStr.split("T")[1].slice(0,5),
      end: selectedSlot.endStr.split("T")[1].slice(0,5)
    },
    createdAt: serverTimestamp()
  });

  window.location.href = `payment.html?id=${paymentRef.id}`;
};
</script>

</body>
</html>

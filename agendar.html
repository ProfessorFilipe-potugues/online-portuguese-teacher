<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Learn Portuguese</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- FullCalendar -->
<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/main.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>

<style>
body {
  margin:0;
  font-family: Arial, sans-serif;
  background:#f4f6f8;
}

header {
  background:#0d6efd;
  color:white;
  padding:15px 30px;
  font-size:20px;
  font-weight:bold;
}

.container {
  max-width:1100px;
  margin:auto;
  padding:25px;
}

.card {
  background:white;
  padding:25px;
  border-radius:10px;
  margin-bottom:25px;
}

.teacher {
  display:flex;
  gap:20px;
}

.teacher img.photo {
  width:90px;
  height:90px;
  border-radius:50%;
}

.name-line {
  display:flex;
  align-items:center;
  gap:6px;
}

.flag {
  width:18px;
}

.badge {
  display:inline-block;
  background:#e7f1ff;
  color:#0d6efd;
  padding:5px 10px;
  border-radius:15px;
  font-size:13px;
  margin:4px 4px 0 0;
}

.grid {
  display:flex;
  gap:25px;
}

.left { flex:2; }
.right { flex:1; }

iframe {
  width:100%;
  height:220px;
  border-radius:10px;
}

#calendar {
  margin-top:15px;
}

button {
  margin-top:15px;
  width:100%;
  padding:14px;
  background:#0d6efd;
  color:white;
  border:none;
  border-radius:8px;
  font-size:16px;
  cursor:pointer;
}
</style>
</head>

<body>

<header>Learn Portuguese</header>

<div class="container">

  <div class="card">
    <h2>Olá, Estudante!</h2>
    <p>Desejo ótimas aulas para ti 📚✨</p>
  </div>

  <div class="card grid">

    <!-- ESQUERDA -->
    <div class="left">
      <div class="teacher">
        <img src="filipe.jpg" class="photo">

        <div>
          <div class="name-line">
            <h2>Filipe Monteiro</h2>
            <img src="https://flagcdn.com/w20/mz.png" class="flag">
          </div>

          <p><strong>Professor de Português</strong></p>

          <div>
            <span class="badge">Acessível</span>
            <span class="badge">Flexível</span>
            <span class="badge">Ideal para exames</span>
            <span class="badge">Professor profissional</span>
          </div>
        </div>
      </div>

      <h3>Sobre mim</h3>
      <p>
        Sou falante nativo de português e ajudo alunos a ganhar confiança
        com aulas práticas e personalizadas.
      </p>
    </div>

    <!-- DIREITA -->
    <div class="right">

      <iframe
        src="https://www.youtube.com/embed/r2J0BiJPR-c"
        allowfullscreen>
      </iframe>

      <div id="calendar"></div>

      <button id="book">Agendar Aula Experimental</button>

    </div>

  </div>
</div>

<!-- FIREBASE + LÓGICA -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, addDoc, collection, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

/* 🔹 FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyBpCB1ePW49VgUvON9LSNEBsTQcKXoAg40",
  authDomain: "portuguese-teacher-platf-68bc5.firebaseapp.com",
  projectId: "portuguese-teacher-platf-68bc5"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let selectedSlot = null;
let currentUser = null;

/* 🔹 AUTH CHECK */
onAuthStateChanged(auth, (user) => {
  if (user) {
    currentUser = user;
    console.log("Usuário logado:", user.uid);
  } else {
    currentUser = null;
    console.log("Usuário não logado");
  }
});

/* 🔹 CALENDAR */
const calendar = new FullCalendar.Calendar(
  document.getElementById("calendar"),
  {
    initialView: "timeGridWeek",
    height: 350,
    selectable: true,
    selectMirror: true,
    allDaySlot: false,
    slotMinTime: "08:00:00",
    slotMaxTime: "20:00:00",
    select(info) {
      selectedSlot = info;
      console.log("Selecionado:", info.startStr, info.endStr);
    }
  }
);

calendar.render();

/* 🔹 BOTÃO */
document.getElementById("book").addEventListener("click", async () => {

  if (!selectedSlot) {
    alert("Seleciona um horário no calendário.");
    return;
  }

  if (!currentUser) {
    alert("Precisas estar logado para agendar.");
    window.location.href = "login.html";
    return;
  }

  try {
    await addDoc(collection(db, "appointments"), {
      studentId: currentUser.uid,
      teacherId: "3Oj4YuYGewO3O9DqPxWrjBln7MG3",
      date: selectedSlot.startStr.split("T")[0],
      start: selectedSlot.startStr.split("T")[1].slice(0,5),
      end: selectedSlot.endStr.split("T")[1].slice(0,5),
      type: "experimental",
      status: "pending_payment",
      createdAt: serverTimestamp()
    });

    alert("Aula experimental marcada com sucesso!");
    // window.location.href = "payment.html";

  } catch (err) {
    console.error(err);
    alert("Erro ao marcar a aula.");
  }
});
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Cadastro do Aluno</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: Arial, sans-serif;
  background:#f4f6f8;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  margin:0;
}

.box {
  background:white;
  padding:30px;
  width:350px;
  border-radius:10px;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

h3 {
  color: #333;
  text-align: center;
  margin-bottom: 20px;
}

label {
  display: block;
  margin-top: 15px;
  margin-bottom: 5px;
  color: #555;
  font-weight: 500;
}

input {
  width:100%;
  padding:12px;
  margin-top:5px;
  border: 1px solid #ddd;
  border-radius: 6px;
  box-sizing: border-box;
  font-size: 14px;
}

input:focus {
  outline: none;
  border-color: #0d6efd;
}

button {
  width:100%;
  padding:12px;
  background:#0d6efd;
  color:white;
  border:none;
  margin-top:20px;
  cursor:pointer;
  border-radius: 6px;
  font-size: 15px;
  font-weight: 500;
  transition: 0.3s;
}

button:hover:not(:disabled) {
  background:#0b5ed7;
}

button:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.loading {
  text-align: center;
  color: #666;
}
</style>
</head>

<body>

<div class="box" id="content" style="display:none">
  <h3>Cadastro do Aluno</h3>
  <p style="color: #666; font-size: 14px; text-align: center;">Complete seu perfil para continuar</p>
  
  <label for="name">Nome Completo:</label>
  <input id="name" type="text" placeholder="Digite seu nome completo" required>
  
  <button id="finishBtn">Concluir Cadastro</button>
</div>

<p class="loading" id="loading">A verificar sessão...</p>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

/* 🔥 FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyBpCB1ePW49VgUvON9LSNEBsTQcKXoAg40",
  authDomain: "portuguese-teacher-platf-68bc5.firebaseapp.com",
  projectId: "portuguese-teacher-platf-68bc5"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;

/* 🔐 GARANTE AUTENTICAÇÃO */
onAuthStateChanged(auth, (user) => {
  if (!user) {
    window.location.href = "login.html";
    return;
  }

  currentUser = user;
  document.getElementById("loading").style.display = "none";
  document.getElementById("content").style.display = "block";
});

/* ✅ CONCLUIR CADASTRO */
document.getElementById("finishBtn").onclick = async () => {
  const nameInput = document.getElementById("name");
  const finishBtn = document.getElementById("finishBtn");
  const name = nameInput.value.trim();

  // Validações
  if (!name) {
    alert("Por favor, escreve o teu nome");
    nameInput.focus();
    return;
  }

  if (name.length < 3) {
    alert("O nome deve ter pelo menos 3 caracteres");
    nameInput.focus();
    return;
  }

  if (!/^[a-zA-ZÀ-ÿ\s]+$/.test(name)) {
    alert("O nome contém caracteres inválidos");
    nameInput.focus();
    return;
  }

  // Loading state
  finishBtn.disabled = true;
  finishBtn.textContent = "A guardar...";

  try {
    await setDoc(
      doc(db, "users", currentUser.uid),
      {
        name: name,
        email: currentUser.email,
        role: "student",
        completedProfile: true,
        createdAt: serverTimestamp()
      },
      { merge: true }
    );

    window.location.href = "dashboard-student.html";
  } catch (error) {
    console.error(error);
    alert("Erro ao guardar os dados. Tenta novamente.");
    finishBtn.disabled = false;
    finishBtn.textContent = "Concluir Cadastro";
  }
};

// Permitir Enter para submeter
document.getElementById("name").addEventListener("keypress", (e) => {
  if (e.key === "Enter") {
    document.getElementById("finishBtn").click();
  }
});
</script>

</body>
</html>

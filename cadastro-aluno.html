<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Cadastro do Aluno</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: Arial, sans-serif;
  background:#f4f6f8;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  margin:0;
}
.box {
  background:white;
  padding:30px;
  width:350px;
  border-radius:10px;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
}
input {
  width:100%;
  padding:12px;
  margin-top:10px;
}
button {
  width:100%;
  padding:12px;
  background:#0d6efd;
  color:white;
  border:none;
  margin-top:15px;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="box" id="content" style="display:none">
  <h3>Cadastro do Aluno</h3>
  <input id="name" placeholder="Nome completo">
  <button id="finishBtn">Concluir</button>
</div>

<p id="loading">A verificar sessão...</p>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

/* 🔥 FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyBpCB1ePW49VgUvON9LSNEBsTQcKXoAg40",
  authDomain: "portuguese-teacher-platf-68bc5.firebaseapp.com",
  projectId: "portuguese-teacher-platf-68bc5"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;

/* 🔐 GARANTE AUTENTICAÇÃO */
onAuthStateChanged(auth, (user) => {
  if (!user) {
    window.location.href = "login.html";
    return;
  }

  currentUser = user;
  document.getElementById("loading").style.display = "none";
  document.getElementById("content").style.display = "block";
});

/* ✅ CONCLUIR CADASTRO */
document.getElementById("finishBtn").onclick = async () => {
  const name = document.getElementById("name").value.trim();

  if (!name) {
    alert("Por favor, escreve o teu nome");
    return;
  }

  await setDoc(
    doc(db, "users", currentUser.uid),
    {
      name: name,
      email: currentUser.email,
      role: "student",
      completedProfile: true,
      createdAt: serverTimestamp()
    },
    { merge: true }
  );

  window.location.href = "dashboard-student.html";
};
</script>

</body>
</html>

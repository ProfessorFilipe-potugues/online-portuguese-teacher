<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Preços</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      padding: 30px;
      color: #333;
    }

    .card {
      background: white;
      max-width: 500px;
      margin: auto;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,.1);
      text-align: center;
    }

    img {
      width: 120px;
      border-radius: 50%;
    }

    h1 {
      color: #0d6efd;
    }

    .price {
      font-size: 32px;
      margin: 20px 0;
    }

    .old {
      text-decoration: line-through;
      color: red;
      font-size: 18px;
      margin-left: 10px;
    }
  </style>
</head>
<body>

<div class="card">
  <img src="filipe.jpg" alt="Filipe">
  <h1>Filipe Monteiro</h1>
  <p>Professor de Português Online</p>

  <div class="price">
    $10 <span class="old">$15</span>
  </div>

  <div id="paypal-button-container"></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
  import { getFirestore, doc, setDoc, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBpCB1ePW49VgUvON9LSNEBsTQcKXoAg40",
    authDomain: "portuguese-teacher-platf-68bc5.firebaseapp.com",
    projectId: "portuguese-teacher-platf-68bc5",
    storageBucket: "portuguese-teacher-platf-68bc5.appspot.com",
    messagingSenderId: "653549982098",
    appId: "1:653549982098:web:42bba4cc75ca56bc69314b"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  onAuthStateChanged(auth, (user) => {
    if (!user) {
      window.location.href = "login.html";
      return;
    }

    const PAYPAL_CLIENT_ID = "SUBSTITUI_PELO_TEU_CLIENT_ID";

    const script = document.createElement("script");
    script.src = `https://www.paypal.com/sdk/js?client-id=${PAYPAL_CLIENT_ID}&currency=USD`;

    script.onload = () => {
      paypal.Buttons({
        createOrder: (data, actions) => {
          return actions.order.create({
            purchase_units: [{
              amount: { value: "10.00" },
              description: "Aula de Português Online"
            }]
          });
        },

        onApprove: async (data, actions) => {
          await actions.order.capture();

          const ref = doc(db, "users", user.uid);
          await setDoc(ref, { balance: increment(10) }, { merge: true });

          window.location.href = "dashboard.html";
        }
      }).render("#paypal-button-container");
    };

    document.body.appendChild(script);
  });
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Preços - Professor de Português Online</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: Arial, sans-serif; padding: 30px; background: #f4f6f8; color: #333; }
    .profile { text-align: center; margin-bottom: 30px; }
    .profile img { border-radius: 50%; width: 150px; }
    h1 { color: #0d6efd; }
    .price { font-size: 28px; margin: 20px 0; }
    .discount { color: red; text-decoration: line-through; font-size: 20px; margin-left: 10px; }
    .btn { display: block; margin: 20px auto; padding: 12px 25px; background: #0d6efd; color: white; text-decoration: none; border-radius: 5px; width: 200px; text-align: center; }
    .btn:hover { background: #084298; }
    .description { max-width: 600px; margin: auto; }
  </style>
</head>
<body>

<div class="profile">
  <img src="filipe.jpg" alt="Filipe Monteiro">
  <h1>Filipe Monteiro</h1>
  <p>Professor de Português Online</p>
  <div class="price">
    $10 <span class="discount">10</span>
  </div>
</div>

<div class="description">
  <p>Aulas para crianças e adultos, focadas em conversação.  
  Objetivos: negócios, viagens, hobbies ou preparação para exames CIPLE, DIPLE, DEPLE.  
  Tenha aulas divertidas e interativas!</p>
</div>

<a class="btn" href="login.html">Criar Conta / Entrar</a>

<div id="paypal-button-container"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
  import { getFirestore, doc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBpCB1ePW49VgUvON9LSNEBsTQcKXoAg40",
    authDomain: "portuguese-teacher-platf-68bc5.firebaseapp.com",
    projectId: "portuguese-teacher-platf-68bc5",
    storageBucket: "portuguese-teacher-platf-68bc5.firebasestorage.app",
    messagingSenderId: "653549982098",
    appId: "1:653549982098:web:42bba4cc75ca56bc69314b"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let currentUser = null;
  onAuthStateChanged(auth, user => {
    if (!user) {
      alert("Faça login antes de pagar!");
      window.location.href = "login.html";
    } else {
      currentUser = user;
    }
  });

  // PayPal
  const PAYPAL_CLIENT_ID = "TEU_CLIENT_ID_AQUI"; // substitui pelo teu Client ID
  const script = document.createElement("script");
  script.src = `https://www.paypal.com/sdk/js?client-id=${PAYPAL_CLIENT_ID}&currency=USD`;
  script.onload = () => {
    paypal.Buttons({
      createOrder: (data, actions) => {
        return actions.order.create({
          purchase_units: [{
            amount: { value: '10.00' },
            description: "Aula de Português Online"
          }]
        });
      },
      onApprove: (data, actions) => {
        return actions.order.capture().then(async details => {
          alert(`Pagamento realizado com sucesso! Obrigado, ${details.payer.name.given_name}`);
          // Atualiza saldo no Firebase
          const userRef = doc(db, "users", currentUser.uid);
          await updateDoc(userRef, { balance: increment(10) });
          window.location.href = "dashboard.html";
        });
      }
    }).render('#paypal-button-container');
  };
  document.body.appendChild(script);
</script>

</body>
</html>
